<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vorace Studio — 404</title>
    <link rel="icon" type="image/png" href="assets/images/vorace-doodle-red-favicon.png" />
    <link rel="stylesheet" href="components/loader.css" />
  <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="404.css" />
    <script src="js/chroma.min.js" defer></script>
</head>
  <body data-page="404">
  <div class="loading-overlay" aria-hidden="true" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0f0f0f; z-index: 2001;">
    <div id="loader-lottie" class="loader-lottie" aria-label="Loading animation"></div>
    <div class="loading-text" style="font-size: clamp(0.8rem, 1.3vw, 0.9rem); color: #f1eee9; text-transform: uppercase;">loading...</div>
  </div>
    <div id="app">
      <!-- Hero/brand block just like homepage first section -->
      <section class="brand-block" aria-label="404 message">
        <h1 class="title">Nothing to see here!</h1>
        <p class="bio">404 Error</p>
      </section>

      <!-- Sticker scatter canvas (no projects) -->
      <section id="scatter" class="scatter" aria-hidden="true"></section>
    </div>

    <!-- Corner menu and footer for consistency across pages -->

  <script src="components/loader.js" defer></script>
  <script src="components/menu.js" defer></script>
  <script src="components/footer.js" defer></script>
  <script src="components/copy.js" defer></script>
<!-- 404-specific script to place stickers around the hero -->
    <script src="404.js"></script>
  </body>
</html>
